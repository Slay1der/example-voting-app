name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/slay1der
  AWS_REGION: us-west-2
  CLUSTER_NAME: capstone-eks

jobs:
  build-test-scan-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          target: ${{ matrix.service == 'vote' && 'final' || '' }}
          load: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Test image runs as non-root
        run: |
          user=$(docker run --rm --entrypoint whoami ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }})
          echo "Container runs as: $user"
          if [ "$user" = "root" ]; then
            echo "FAIL: container runs as root"
            exit 1
          fi

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          target: ${{ matrix.service == 'vote' && 'final' || '' }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}

  deploy:
    needs: build-test-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show OIDC token claims (debug)
        uses: actions/github-script@v7
        with:
          script: |
            const t = await core.getIDToken('sts.amazonaws.com');
            const c = JSON.parse(Buffer.from(t.split('.')[1], 'base64url').toString());
            core.info(`sub: ${c.sub}`);
            core.info(`aud: ${c.aud}`);

      - name: Get temporary AWS credentials (OIDC, no stored keys)
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check the cluster is up
        id: cluster
        run: |
          if [ "${{ steps.aws.outcome }}" = "success" ] && aws eks describe-cluster --name "$CLUSTER_NAME" > /dev/null 2>&1; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cluster is not running (infrastructure destroyed to save cost). Skipping deploy."
          fi

      - name: Connect kubectl to EKS
        if: steps.cluster.outputs.up == 'true'
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Set up Helm
        if: steps.cluster.outputs.up == 'true'
        uses: azure/setup-helm@v4

      - name: Deploy with Helm
        if: steps.cluster.outputs.up == 'true'
        run: |
          helm upgrade --install voting ./helm/voting-app \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 5m
          helm history voting
          kubectl get pods
